plugins {
    id 'java'
    id 'application'
}

group = 'com.daniel.blocksurvival'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def lwjglVersion = "3.4.1"
def jomlVersion = "1.10.8"

def operatingSystem = System.getProperty("os.name").toLowerCase()
def architecture = System.getProperty("os.arch").toLowerCase()

def lwjglNatives

if (operatingSystem.contains("win")) {
    lwjglNatives = architecture.contains("64")
            ? "natives-windows"
            : "natives-windows-x86"
} else if (operatingSystem.contains("mac")) {
    lwjglNatives = architecture.contains("aarch64") ||
            architecture.contains("arm64")
            ? "natives-macos-arm64"
            : "natives-macos"
} else {
    lwjglNatives = architecture.contains("aarch64") ||
            architecture.contains("arm64")
            ? "natives-linux-arm64"
            : "natives-linux"
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"

    implementation "org.joml:joml:$jomlVersion"
}

application {
    mainClass = 'com.daniel.blocksurvival.Main'

    if (operatingSystem.contains("mac")) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}